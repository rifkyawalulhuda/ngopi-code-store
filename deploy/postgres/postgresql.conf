# PostgreSQL Configuration for NgopiCode Digital Store
# Optimized for 8GB RAM self-hosted deployment (1GB allocated to PostgreSQL)
#
# Security notes:
# - All queries from TypeORM use parameterized statements (Req 13.6)
# - Connection pool limited to 10 connections from Vendure (Req 12.2)
# - listen_addresses restricted to Docker network

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 20

# Memory Settings (optimized for 1GB container limit)
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL Settings
wal_buffers = 8MB
min_wal_size = 80MB
max_wal_size = 1GB

# Query Planner
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging (minimal for production)
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Security
password_encryption = scram-sha-256
ssl = off
